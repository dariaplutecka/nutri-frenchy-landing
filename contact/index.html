<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt - Nutri Frenchy</title>
  <meta name="description" content="Napisz do Nutri Frenchy. Zgłoś problem, pomysł lub opinię." />
  <link rel="canonical" href="https://nutrifrenchy.org/contact" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=16" />
</head>
<body data-contact-page>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" data-i18n-aria="a11y.home" aria-label="Nutri Frenchy - strona główna">
        <img src="/assets/logo-wordmark.png" alt="Nutri Frenchy" class="brand-logo brand-logo--wordmark" width="586" height="244" />
      </a>
      <div class="header-actions">
        <nav class="header-nav" data-i18n-aria="a11y.nav" aria-label="Nawigacja">
          <a href="/" data-i18n="nav.home">Strona główna</a>
          <a href="/articles" data-i18n="footer.articles">Artykuły</a>
          <a href="/#download" class="nav-cta" data-i18n="nav.download">Pobierz</a>
        </nav>
        <div class="lang-switch" role="group" data-i18n-aria="a11y.langSwitch" aria-label="Wybierz język">
          <button type="button" class="lang-btn lang-btn--active" data-lang="pl" aria-pressed="true">PL</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="contact-page">
    <div class="container contact-layout">
      <header class="contact-header">
        <p class="breadcrumb">
          <a href="/" data-i18n="nav.home">Strona główna</a>
          <span aria-hidden="true"> / </span>
          <span data-i18n="nav.contact">Kontakt</span>
        </p>
        <h1 data-i18n="contact.title">Kontakt</h1>
        <p class="contact-subtitle" data-i18n="contact.subtitle">Napisz do mnie</p>
      </header>

      <div id="contact-success" class="contact-success card" hidden>
        <span class="contact-success-icon" aria-hidden="true">✓</span>
        <p data-i18n="contact.success">Dziękuję! Twoja wiadomość dotarła do mnie.</p>
      </div>

      <form id="contact-form" class="contact-form card" novalidate>
        <div class="contact-speech-row">
          <img src="/assets/mascot.png" srcset="/assets/mascot@2x.png 2x" alt="" class="contact-mascot" width="80" height="139" />
          <div class="contact-bubble-wrap">
            <div class="contact-bubble-tail" aria-hidden="true"></div>
            <div class="contact-bubble">
              <p data-i18n="contact.mascotSpeech">Masz problem z aplikacją lub pomysł, jak ją ulepszyć?</p>
            </div>
          </div>
        </div>

        <label for="contact-email" data-i18n="contact.emailLabel">Twój e-mail</label>
        <input
          id="contact-email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          required
          data-i18n-placeholder="contact.emailPlaceholder"
          placeholder="np. ty@example.com"
        />

        <label for="contact-message" class="sr-only" data-i18n="contact.messagePlaceholder">Wiadomość</label>
        <textarea
          id="contact-message"
          name="message"
          rows="5"
          maxlength="4000"
          required
          data-i18n-placeholder="contact.messagePlaceholder"
          placeholder="Opisz swój problem lub pomysł…"
        ></textarea>

        <input id="contact-image-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />

        <div id="contact-image-empty">
          <button type="button" class="contact-image-add" id="contact-image-add">
            <span aria-hidden="true">🖼</span>
            <span data-i18n="contact.addImage">Dodaj zdjęcie</span>
          </button>
        </div>

        <div id="contact-image-preview" class="contact-image-preview" hidden>
          <img id="contact-image-thumb" alt="" />
          <div class="contact-image-actions">
            <button type="button" class="contact-image-pill" id="contact-image-change" data-i18n="contact.changeImage">Zmień zdjęcie</button>
            <button type="button" class="contact-image-pill contact-image-pill--danger" id="contact-image-remove" data-i18n="contact.removeImage">Usuń</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="contact-submit" data-i18n="contact.send">Wyślij wiadomość</button>
        <p id="contact-message-status" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">
        <a class="footer-link" href="/articles" data-i18n="footer.articles">Artykuły</a>
        ·
        <a class="footer-link" href="/contact" data-i18n="footer.contact">Kontakt</a>
        ·
        <a class="footer-link" href="/terms" data-i18n="footer.terms">Regulamin</a>
        ·
        <a class="footer-link" href="/privacy" data-i18n="footer.privacy">Polityka prywatności</a>
      </p>
      <p class="footer-copy">© <span id="year"></span> Nutri Frenchy</p>
    </div>
  </footer>

  <script src="/config.js"></script>
  <script src="/i18n.js?v=16"></script>
  <script src="/contact.js?v=1"></script>
</body>
</html>
